name: StreamRix — Build All Platforms (Tauri)

# BUILD-ONLY REPOSITORY.
# This workflow checks out the PRIVATE source repo (via STREAMRIX_SRC_TOKEN),
# compiles the real Rust/Tauri native app, and publishes all platform binaries
# as a GitHub Release. No source code is stored here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.0.2 (blank = auto v<run number>)'
        required: false
        default: ''
  repository_dispatch:
    types: [build]
  workflow_call:

permissions:
  contents: write

concurrency:
  group: streamrix-all-platform-build
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.event.client_payload.version || '' }}
  # Tauri uses this to sign the updater bundles — leave blank to skip signing
  TAURI_SIGNING_PRIVATE_KEY: ''
  CARGO_TERM_COLOR: always

# ─────────────────────────────────────────────────────────────────────────────
# WINDOWS — NSIS installer + portable EXE
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-windows:
    name: Windows (EXE + NSIS installer)
    runs-on: windows-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: streamrix/streamrix
          token: ${{ secrets.STREAMRIX_SRC_TOKEN }}
          path: src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync web frontend into Tauri
        working-directory: src/RUST
        run: node sync_frontend.cjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            src/RUST/src-tauri/target
          key: windows-cargo-${{ hashFiles('src/RUST/src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows (no updater signing)
        working-directory: src/RUST
        shell: pwsh
        run: |
          $env:PATH = "${{ env.CARGO_HOME }}\bin;$env:PATH"
          cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = Get-Item "src/RUST/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsis) { Copy-Item $nsis.FullName dist/StreamRix-Setup.exe }
          $exe  = "src/RUST/src-tauri/target/release/rixtv_tauri.exe"
          if (Test-Path $exe) { Copy-Item $exe dist/StreamRix.exe }
          dir dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/StreamRix-Setup.exe
            dist/StreamRix.exe

# ─────────────────────────────────────────────────────────────────────────────
# MACOS — DMG + ZIP
# ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG + ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: streamrix/streamrix
          token: ${{ secrets.STREAMRIX_SRC_TOKEN }}
          path: src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync web frontend into Tauri
        working-directory: src/RUST
        run: node sync_frontend.cjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/RUST/src-tauri/target
          key: macos-cargo-${{ hashFiles('src/RUST/src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build macOS (no code signing)
        working-directory: src/RUST
        run: cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          DMG=$(find src/RUST/src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          [ -n "$DMG" ] && cp "$DMG" dist/StreamRix.dmg
          # Also package the .app as a ZIP for direct install
          APP=$(find src/RUST/src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          [ -n "$APP" ] && ditto -c -k --keepParent "$APP" dist/StreamRix-Mac.zip
          ls -lh dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/StreamRix.dmg
            dist/StreamRix-Mac.zip

# ─────────────────────────────────────────────────────────────────────────────
# LINUX — DEB + AppImage
# ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (DEB + AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: streamrix/streamrix
          token: ${{ secrets.STREAMRIX_SRC_TOKEN }}
          path: src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev pkg-config \
            libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libatk1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync web frontend into Tauri
        working-directory: src/RUST
        run: node sync_frontend.cjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/RUST/src-tauri/target
          key: linux-cargo-${{ hashFiles('src/RUST/src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Linux
        working-directory: src/RUST
        run: cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          DEB=$(find src/RUST/src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -1)
          [ -n "$DEB" ] && cp "$DEB" dist/streamrix.deb
          APPIMG=$(find src/RUST/src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          [ -n "$APPIMG" ] && cp "$APPIMG" dist/StreamRix.AppImage
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/streamrix.deb
            dist/StreamRix.AppImage

# ─────────────────────────────────────────────────────────────────────────────
# ANDROID — APK (phone/tablet + Android TV via Leanback)
# ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: '27.1.12297006'
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: streamrix/streamrix
          token: ${{ secrets.STREAMRIX_SRC_TOKEN }}
          path: src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "ndk;${{ env.NDK_VERSION }}" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync web frontend into Tauri
        working-directory: src/RUST
        run: node sync_frontend.cjs

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/RUST/src-tauri/target
          key: android-cargo-${{ hashFiles('src/RUST/src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Init Tauri Android project
        working-directory: src/RUST
        run: cargo tauri android init

      - name: Restore APK signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'streamrix2026' }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            mkdir -p src/RUST/src-tauri/gen/android/app
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode \
              > src/RUST/src-tauri/gen/android/app/streamrix.keystore
            echo "KEY_STORE_PATH=streamrix.keystore" >> $GITHUB_ENV
            echo "KEY_ALIAS=streamrix"              >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEYSTORE_PASS"      >> $GITHUB_ENV
            echo "STORE_PASSWORD=$KEYSTORE_PASS"    >> $GITHUB_ENV
          fi

      - name: Build Android APK (release)
        working-directory: src/RUST
        run: cargo tauri android build --apk

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find src/RUST/src-tauri/gen/android -name "*.apk" -path "*/release/*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src/RUST/src-tauri/gen/android -name "*.apk" 2>/dev/null | head -1)
          fi
          echo "Found APK: $APK"
          [ -n "$APK" ] && cp "$APK" dist/streamrix.apk
          ls -lh dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          retention-days: 7
          if-no-files-found: error
          path: dist/streamrix.apk

# ─────────────────────────────────────────────────────────────────────────────
# LG webOS IPK (Python-built hosted-shell — no Tauri available for webOS)
# ─────────────────────────────────────────────────────────────────────────────
  build-webos:
    name: LG webOS IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pillow

      - name: Fetch branding from live site
        run: bash scripts/fetch-assets.sh

      - name: Build webOS IPK
        run: python scripts/build_webos_ipk.py

      - name: Upload webOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos
          retention-days: 7
          if-no-files-found: error
          path: dist/streamrix.ipk

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE — collect all artifacts, publish GitHub Release, update website links
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish release + refresh website links
    needs: [build-windows, build-macos, build-linux, build-android, build-webos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh artifacts/

      - name: Generate download-links.json
        run: python scripts/generate_download_links.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || format('v{0}', github.run_number) }}
          name: StreamRix ${{ env.RELEASE_TAG || format('build {0}', github.run_number) }}
          generate_release_notes: true
          files: |
            download-links.json
            artifacts/StreamRix-Setup.exe
            artifacts/StreamRix.exe
            artifacts/StreamRix.dmg
            artifacts/StreamRix-Mac.zip
            artifacts/streamrix.deb
            artifacts/StreamRix.AppImage
            artifacts/streamrix.apk
            artifacts/streamrix.ipk
